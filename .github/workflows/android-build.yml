name: Android build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :desktop:assembleDebug
      - name: Upload diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: dexdesktop-diagnostics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload DexDesktop application APK
        uses: actions/upload-artifact@v4
        with:
          name: dexdesktop-desktop-debug
          path: desktop/build/outputs/apk/debug/desktop-debug.apk
          if-no-files-found: error
          retention-days: 14
